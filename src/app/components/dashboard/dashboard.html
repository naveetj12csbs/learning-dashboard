<h1>Dashboard</h1>

<div class="cards">

  <div class="card">
    <h3>Total Courses</h3>
    <p>{{ courseService.courses.length }}</p>
  </div>

  <div class="card">
    <h3>Completed</h3>
    <p>{{ getCompleted() }}</p>
  </div>

  <div class="card">
    <h3>In Progress</h3>
    <p>{{ getInProgress() }}</p>
  </div>

  <div class="card">
    <h3>Not Started</h3>
    <p>{{ getNotStarted() }}</p>
  </div>

</div>
